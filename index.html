<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio de Timoteo Czerwiak, estudiante de tecnología en ORT Belgrano. Backend, web e IA."
    />
    <title>Timoteo Czerwiak</title>
    <!-- Aplica el tema guardado antes de pintar, así no parpadea al cargar -->
    <script>
      try {
        const t = localStorage.getItem("timo-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
